name: Release

on:
  # Tags pushed by hand (from a maintainer's machine) trigger this directly.
  # The tag tagpr pushes with GITHUB_TOKEN deliberately does not — tagpr.yml
  # calls this workflow instead. See docs/adr/0015-*.md.
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      ref:
        description: Tag to build the release from. Defaults to the pushed ref.
        type: string
        required: false

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
